receivers:
  # ── Syslog ────────────────────────────────────────────────────────
  # Bound to unprivileged ports inside the container so the pod can run
  # as non-root; map the standard 514/601 onto them at the Service,
  # Compose port mapping or firewall, whichever your deployment uses.
  #
  # allow_skip_pri_header keeps non-conforming UDM frames (long firewall
  # lines, JSON blobs without a PRI) from being dropped as parse errors.
  # This was the failure that made an earlier version of this config ship
  # raw text instead of parsing — parsed records with no timestamp were
  # rejected downstream. The timestamp_guard processor backstops that.
  #
  # Multi-line payloads ARE reassembled, but only the two shapes that
  # were verified against a real frame: `linkcheck` speedtest results,
  # whose continuation lines carry no header at all, and
  # ubios-udapi-server's unterminated single-quoted payloads, whose
  # continuation arrives as a complete frame with the header and the
  # sub-tag re-emitted. See the two recombine operators below and
  # docs/known-issues.md. Every other multi-line payload is still one
  # record per datagram.
  syslog/unifi_udp:
    udp:
      listen_address: 0.0.0.0:5514
    protocol: rfc3164
    # ⚠ SET THIS TO YOUR OWN TIMEZONE. The UDM stamps RFC3164 syslog in
    # LOCAL time with no offset, so this must match the UDM's timezone or
    # every non-CEF record lands hours out. Verified 2026-08-11 against
    # the UNIFIutcTime CEF field: with UTC here, records land one hour in
    # the future during BST.
    #
    # It fails SILENTLY — there is no error, just wrong timestamps. An
    # unset env var expands to empty and the receiver falls back to UTC
    # (verified against 0.157.0), which is why there is a default here
    # rather than a bare ${env:...}. Set the variable explicitly in your
    # deployment; the default only catches someone who has cloned this
    # and not read the README.
    #
    # To check: compare a device-syslog timestamp against the wall clock
    # on the UDM. A whole number of hours out means this is wrong.
    #
    # This only backstops non-CEF frames now — transform/unifi_ecs
    # re-stamps every CEF record from UNIFIutcTime, which is UTC and
    # millisecond-precise where the syslog header is local and truncated
    # to the second.
    location: ${env:UNIFI_SYSLOG_TIMEZONE:-Etc/UTC}
    allow_skip_pri_header: true
    operators: &unifi_syslog_operators
      # ── ONE root cause, two operators ──────────────────────────────
      # A syslog message containing a newline reaches the receiver as
      # several datagrams, and the gateway sends the pieces in one of
      # TWO shapes. Both operators below exist because of that, and
      # both have to cope with both shapes:
      #
      #   UNHEADED  only the first datagram carries a PRI and an
      #             RFC3164 header; the rest are bare text. The
      #             receiver's own syslog parser rejects them, so they
      #             arrive here with NO attributes and their raw text
      #             in body — leading whitespace already stripped by
      #             the input operator.
      #   HEADED    every datagram is a complete, well-formed frame:
      #             PRI, timestamp, hostname (doubled or not) and the
      #             tag are all re-emitted in front of each line. The
      #             syslog parser accepts every one of them, so
      #             `message` is set on all of them and nothing about
      #             a continuation looks like a continuation.
      #
      # Assuming UNHEADED is what issue #32 was: an operator keyed on
      # `attributes?.message == nil` simply never fires against a
      # gateway that re-heads. Do not write a new predicate that keys
      # on the absence of a header. Test for the TAG and for the
      # payload's own delimiters, which are the same in both shapes.
      #
      # Operators run AFTER the receiver's own syslog parser (the
      # internal chain is udp_input → syslog_parser → these).
      #
      # ── Reassemble linkcheck's multi-line JSON (issue #9) ──────────
      # `linkcheck`, the gateway's WAN speedtest daemon, pretty-prints
      # its result as JSON, one datagram per line. Without this
      # operator one frame became one record per line.
      #
      # Verified against 0.157.0 with a real captured frame: 11
      # UNHEADED datagrams in, 1 record out, and the header entry's
      # attributes, timestamp and severity survive (recombine keeps the
      # first entry's fields by default).
      #
      # THE HEADED SHAPE IS ALSO HANDLED, and the predicate below was
      # rewritten for it. The original one tested
      # `attributes.message matches "\\{$"` for the head and
      # `attributes?.message == nil` for the continuations, which
      # against a re-heading gateway fails in two directions at once —
      # measured against 0.157.0 by replaying a re-headed frame through
      # the shipped config, and filed as issue #34:
      #   - the continuation clause never fires, so a seven-datagram
      #     payload came out as six separate records plus a stranded
      #     head, each one still tagged unifi.speedtest, and the JSON
      #     never parsed;
      #   - the head clause fires and nothing ever closes the batch,
      #     because `body == "}"` cannot match a closing datagram that
      #     carries a header. Two successive speedtests then produced
      #     ONE record whose body was the two head lines glued
      #     together. That is precisely the swallowing the warning
      #     below is about, reached from inside the matcher rather than
      #     from an unrelated frame.
      #
      # So the predicate no longer tries to recognise a linkcheck
      # payload LINE at all. It recognises the linkcheck TAG, in all
      # three forms the parser can leave it in, and lets the closing
      # brace do the delimiting. Every frame this daemon emits is part
      # of one payload — it has no single-line output — so accepting
      # all of them is not a widening in practice, and it is immune to
      # a firmware change in the payload's first line.
      #
      # THE `if` IS LOAD-BEARING. recombine has no pass-through: an
      # entry it accepts is appended to the open batch, whatever it is.
      # Scoping it to linkcheck-shaped entries is what stops an
      # unrelated frame that happens to arrive mid-payload from being
      # swallowed. Verified by injecting one: it passes straight
      # through, unbatched (it may be emitted before the linkcheck
      # record, since that one waits for its closing brace).
      #
      # The tag test accepts BOTH gateway hostname shapes. A UDM
      # doubles its hostname, so RFC3164 leaves the tag in `message`;
      # a device that does not double it gets `appname` set instead.
      # Matching only the first shape is exactly the bug in issue #24 —
      # both are checked here, and both are verified.
      #
      # Only one of is_first_entry and is_last_entry may be set, so the
      # frame is bounded by its closing brace — in either shape. The
      # UNHEADED closing datagram IS the brace, so `body == "}"`; the
      # HEADED one has the brace after the tag, so `body` ends `: }`.
      # Both are tested, and a payload that never sends a brace at all
      # is not lost and not held for ever: recombine's default
      # force_flush_period (5s) emits what it has. A well-formed frame
      # is emitted the moment the brace arrives, with no added latency.
      #
      # max_unmatched_batch_size MUST be 0. It defaults to 100, and with
      # is_last_entry the batch is "unmatched" right up until the
      # closing brace — so the default SPLITS any frame longer than 100
      # lines into two records, with no error and no warning. Measured
      # against 0.157.0: a 152-line frame came out as 2 records at the
      # default and 1 record at 0. A silent split is the one failure
      # mode this pipeline is built to avoid, and no real frame is
      # anywhere near 100 lines, so the default buys nothing and costs
      # correctness. max_batch_size is left at its default 1000 as a
      # runaway guard.
      #
      # Two kinds of collector log noise are UNAVOIDABLE here and are
      # not a sign of a broken parser:
      #   - the receiver logs a syslog_parser and a udp_input error for
      #     every continuation line (two per line). Those are raised
      #     inside the receiver, BEFORE any operator runs, so nothing
      #     here can suppress them. on_error: send_quiet would, but it
      #     would also silence genuine parse errors on every other
      #     frame, which is a bad trade.
      #   - recombine warns once per batched entry that the entry has
      #     no source_identifier. The default identifier is a FILE
      #     attribute that no UDP path ever sets, so there is nothing
      #     to point it at on any syslog entry, headed or not.
      #     Harmless: with one gateway there is only ever one source,
      #     and pooling is what we want. The collector samples its own
      #     logs, so do not read the count as the number raised.
      # The first is UNHEADED-only — a headed continuation parses
      # cleanly and raises nothing — and it already dominates the
      # second, so neither is worth an extra operator on every record
      # to clean up.
      #
      # KNOWN LIMIT: because every entry pools into one batch, two
      # gateways running a speedtest at the same instant would have
      # their lines interleaved. On the UNHEADED shape there is nothing
      # to demultiplex on at all; on the HEADED shape every datagram
      # carries a hostname, but recombine has no way to say "close the
      # batch this hostname opened", so it does not help. Single-gateway
      # sites are unaffected, which is every site this has run on.
      - type: recombine
        if: >-
          attributes?.appname == "linkcheck"
          or (attributes?.message != nil
          and attributes.message matches "(^|\\s)linkcheck\\[[0-9]+\\]:")
          or (attributes?.message == nil and body matches "^[\\{\\}\"]")
        combine_field: body
        combine_with: "\n"
        is_last_entry: >-
          body == "}" or body matches ":\\s\\}$"
        max_unmatched_batch_size: 0

      # ── Reassemble a re-headered continuation (issue #32) ───────────
      # The same failure class as #9 with the opposite assumption, which
      # is why it needs its own operator rather than another clause on
      # the one above. A `linkcheck` continuation line carries NO
      # header; this one carries a complete one.
      #
      # ubios-udapi-server's WAN failover ICMP monitor logs a
      # single-quoted blob whose closing quote sits after a newline:
      #
      #   …: wan-failover-monitor-icmp: wf-monitor-… could not read
      #      status from '/run/….sock'. Received data: '… 0.594
      #   …: wan-failover-monitor-icmp: '
      #
      # Both lines arrive as complete RFC3164 frames — the full header
      # AND the `wan-failover-monitor-icmp:` sub-tag are re-emitted on
      # the second. Whether the daemon logs per line or rsyslog splits
      # on the embedded newline is not decidable from a capture, and
      # does not matter here: what reaches the receiver is two
      # well-formed frames, the first missing its closing quote and the
      # second carrying a lone `'` and nothing else.
      #
      # Untreated that is two records per complaint, one of them
      # content-free, and an event.original on the first that is not a
      # faithful copy of the payload — which this pipeline otherwise
      # guarantees. Not merely cosmetic: over six hours on 2026-08-22
      # this monitor produced 54,387 records in unifi.system against a
      # steady state of ~700 per 2h for the whole dataset, and about
      # half of the burst was the junk half-record.
      #
      # The #9 operator cannot be widened to cover it. Its
      # continuation clause keys on `attributes?.message == nil`, which
      # is precisely the assumption that fails here, and its delimiter
      # is a brace or a double quote, not a single quote.
      #
      # THE MATCHER. Three conjuncts, and each one is doing work:
      #
      #   1. attributes?.message != nil — a header-less continuation
      #      line (a linkcheck one, say) must not reach the tests
      #      below, which would raise on a nil.
      #   2. the entry is a ubios-udapi-server frame, in EITHER gateway
      #      hostname shape. A UDM doubles its hostname so RFC3164
      #      leaves the tag in `message`; a device that does not double
      #      it gets `appname` set instead. Testing only the first
      #      shape is the bug in issue #24, so both are tested and both
      #      are exercised by the corpus.
      #   3. the message ends in an UNTERMINATED quoted value:
      #      `: '` followed by no further `'` before end of text. This
      #      is the whole safety property. RE2 has no lookahead and
      #      cannot count, but `: '[^']*$` needs neither — it asserts
      #      directly that the last quote in the message opens a value
      #      and nothing closes it.
      #
      # Deliberately NOT scoped to wan-failover-monitor-icmp. The bug
      # is a property of the quoting, not of that one sub-tag, and
      # ubios-udapi-server has more than one — `process:` is in the
      # corpus alongside it — with nobody here having enumerated the
      # rest or their payload shapes. Conjunct 3 is what makes
      # generalising safe rather than reckless: it costs nothing to
      # cover a sub-tag that never does this, because a terminated
      # message can never match it. The tag anchor in conjunct 2 stays,
      # though — dropping it would let ANY daemon's quoted line open a
      # batch, which is exactly the over-match the #9 comment warns of.
      #
      # Verified against 0.157.0 by injection, not assumed: a
      # ubios-udapi-server line with a CLOSED quote passes straight
      # through as its own record, the `process:` frame with an
      # apostrophe in its prose is untouched, and an unrelated systemd
      # frame sent between the two datagrams of a real complaint is
      # emitted separately rather than swallowed into the batch.
      #
      # WHAT IT STILL COSTS WHEN IT IS WRONG. A ubios-udapi-server line
      # that genuinely ends `key: 'value` with no continuation to come
      # opens a batch and waits out recombine's default
      # force_flush_period before being emitted alone. Measured against
      # 0.157.0: the record turned up 5.75s later, complete, correctly
      # parsed and with nothing else attached to it. Bounded latency on
      # one record, no loss — the same trade the #9 operator already
      # makes for a stray brace-leading line. No line of that shape is
      # in the corpus or in the capture behind #32; if one turns up it
      # is the argument for narrowing this to named sub-tags.
      #
      # is_last_entry rather than is_first_entry: only one of the two
      # may be set, and the frame is bounded at its end. Reading `body`
      # and not `message` is deliberate — body is the raw frame on
      # both hostname shapes, so one test covers both, where `message`
      # differs between them.
      #
      # max_unmatched_batch_size MUST be 0, for the reason set out on
      # the operator above: with is_last_entry the batch is
      # "unmatched" until the closing entry arrives, and the default of
      # 100 would silently split a longer payload into two records.
      # This producer sends two datagrams, so the default is currently
      # harmless — it is set anyway, because "currently harmless"
      # depends on a payload length nobody controls.
      #
      # combine_field is body, so the reassembled event.original is the
      # two datagrams exactly as they arrived, re-headered second line
      # and all. That is what the wire carried and it is what the
      # replay harness correlates on. The re-emitted header is stripped
      # OUT OF `message` — not out of event.original — by section 0 of
      # transform/device_syslog, which is where the reassembled record
      # is put back together; see the comment there.
      - type: recombine
        if: >-
          attributes?.message != nil
          and (attributes?.appname == "ubios-udapi-server"
          or attributes.message matches "(^|\\s)ubios-udapi-server\\[[0-9]+\\]:")
          and attributes.message matches ": '[^']*$"
        combine_field: body
        combine_with: "\n"
        is_last_entry: >-
          body matches ": '$"
        max_unmatched_batch_size: 0

      # UniFi is not wholly CEF — only events routed through the SIEM
      # Server are. The operator is conditional, so ordinary syslog
      # passes through with just the RFC3164 fields set.
      #
      # The syslog parser writes to attributes, NOT body: the message
      # text lands in attributes.message and body keeps the raw frame.
      #
      # Only the CEF envelope is split here; the extension string is
      # turned into a map by transform/cef_extensions below. Capture
      # groups are all cef_-prefixed so the cleanup stage can drop the
      # working set with one delete_matching_keys.
      - type: regex_parser
        if: 'attributes?.message != nil and attributes.message matches "CEF:\\d+\\|"'
        parse_from: attributes.message
        regex: 'CEF:(?P<cef_version>\d+)\|(?P<cef_vendor>[^|]*)\|(?P<cef_product>[^|]*)\|(?P<cef_device_version>[^|]*)\|(?P<cef_signature_id>[^|]*)\|(?P<cef_name>[^|]*)\|(?P<cef_severity>[^|]*)\|(?P<cef_extensions>.*)'
        on_error: send

  # UniFi's newer SIEM Server option emits RFC5424 over TCP.
  syslog/unifi_tcp:
    tcp:
      listen_address: 0.0.0.0:6601
    protocol: rfc5424
    allow_skip_pri_header: true
    operators: *unifi_syslog_operators

  # There is deliberately no webhook receiver. The UDM emitted an Alarm
  # Manager webhook AND a SIEM Server syslog record for every alarm, with
  # identical timestamps and identical text, and syslog is the superset —
  # it carries every SIEM event, not just the ones Alarm Manager was
  # configured to forward. See the README for what that gives up (UniFi
  # Protect and Access alarms, which the Network SIEM feed does not
  # carry) and issue #21 if you have that hardware to test against.
