# The default config set is logs only. It is assembled from repeated
# --config flags — the collector has no glob or directory mode, so an
# unlisted file is silently ignored rather than an error, which makes
# this list the entire configuration surface:
#
#   --config=/conf/10-receivers-logs.yaml
#   --config=/conf/20-processors-logs.yaml
#   --config=/conf/40-exporters.yaml
#   --config=/conf/90-service.yaml
#
# SNMP polling is an opt-in module and is NOT in that list. To add it,
# append its three files to the flags above — nothing here changes:
#
#   --config=/conf/optional/snmp/15-receivers-snmp.yaml
#   --config=/conf/optional/snmp/30-processors-metrics.yaml
#   --config=/conf/optional/snmp/91-service-metrics.yaml
#
# That last file merges a metrics/unifi_snmp pipeline into the `service`
# block below. See docs/snmp.md — it needs SNMPv3 credentials, reaches
# the console only, and is not covered by CI.
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    # Syslog splits by parse outcome at routing/parse_failures; the
    # export and failure pipelines below receive from the connector.
    # Note tag_parse_failures runs BEFORE strip_working_fields, since
    # it inspects the cef_* working attributes.
    #
    # device_syslog sits between unifi_ecs and strip_working_fields: it
    # needs the non-CEF fallback to have run (it refines event.dataset off
    # unifi.syslog) and it reads `message`, which strip removes.
    logs/unifi_syslog:
      receivers: [syslog/unifi_udp, syslog/unifi_tcp]
      processors:
        - memory_limiter
        - transform/cef_extensions
        - transform/tag_parse_failures
        - transform/unifi_ecs
        - transform/device_syslog
        - transform/tag_mapping_failures
        - transform/strip_working_fields
      exporters: [routing/parse_failures]

    logs/unifi_syslog_export:
      receivers: [routing/parse_failures]
      processors:
        - transform/timestamp_guard
        - resource/unifi
        - batch
      exporters: [otlp_grpc/gateway]

    # Records that failed to parse take the same export path, but are
    # also printed in full by the debug exporter. They carry
    # unifi.parse_failure with the stage that failed, so route or filter
    # them downstream on that attribute if you want them separated.
    logs/unifi_parse_failures:
      receivers: [routing/parse_failures]
      processors:
        - transform/timestamp_guard
        - resource/unifi
        - batch
      exporters: [otlp_grpc/gateway, debug/parse_failures]
