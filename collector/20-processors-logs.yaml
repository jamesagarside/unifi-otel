processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

  # ── CEF extension string → map ────────────────────────────────────
  # CEF has no quoting, and UniFi emits values containing spaces on
  # nearly every event (the site name, policy names, interface
  # "Internet 1", and a whole msg= sentence). A space-split
  # key_value_parser errors on all of them, and RE2 has no lookahead to
  # split around them.
  #
  # So: rewrite each " key=" boundary to a newline, then split on that.
  # A CEF key is [A-Za-z][A-Za-z0-9_]*, and no UniFi value contains a
  # "word=" token, so the boundary is unambiguous. This replaced a
  # per-field regex approach that only ever extracted 7 of the 78 keys
  # the UDM actually emits — and whose src= pattern matched 5 of 106
  # live records, because firewall events carry the source as
  # UNIFIsrcClientIp, not src.
  #
  # Verified against the 0.157.0 image: "\n" is a real newline in an
  # OTTL string literal and $$1 back-references the capture group.
  transform/cef_extensions:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - 'attributes["cef_extensions"] != nil'
        statements:
          - 'replace_pattern(log.attributes["cef_extensions"], "\\s([A-Za-z][A-Za-z0-9_]*)=", "\n$$1=")'
          - 'set(log.attributes["cef_kv"], ParseKeyValue(log.attributes["cef_extensions"], "=", "\n"))'

  # ── Syslog/CEF → ECS ──────────────────────────────────────────────
  # Naming follows the ECS ↔ OTel alignment table:
  #   - source.ip / destination.ip are "match" pairs with the semconv
  #     source.address / destination.address, so BOTH are emitted (an
  #     alias is not always available downstream, and ECS-only consumers
  #     — security detection rules — need the .ip spelling).
  #   - ports, macs, domains, network.transport and network.direction are
  #     spelled identically in both schemas.
  #   - network.protocol and process.executable are NOT: the table marks
  #     them `equivalent` to network.protocol.name /
  #     process.executable.path, but the ECS name IS the OTel namespace,
  #     and a document store cannot map one field as both a leaf and an
  #     object. Keeping the ECS spelling is deliberate — see the schema
  #     stance in the README.
  #     process.name maps to no OTel attribute at all.
  #   - event.*, observer.*, rule.*, user.* have no OTel counterpart,
  #     so ECS names stand.
  # Vendor-specific values that ECS has no home for keep a unifi.*
  # prefix rather than being dropped.
  transform/unifi_ecs:
    error_mode: ignore
    log_statements:
      # ---- Plain syslog envelope (applies to CEF and non-CEF alike) --
      - context: log
        statements:
          - 'set(log.attributes["observer.name"], log.attributes["hostname"]) where log.attributes["hostname"] != nil'
          # The UDM uses the literal syslog tag "CEF" on every CEF frame,
          # which is not a process name — only carry a real one.
          - 'set(log.attributes["process.name"], log.attributes["appname"]) where log.attributes["appname"] != nil and log.attributes["appname"] != "CEF"'
          # proc_id is only populated by the RFC5424 parser and by RFC3164
          # frames with a single hostname. Doubled-hostname UDM frames get
          # their pid from transform/device_syslog instead.
          - 'set(log.attributes["process.pid"], Int(log.attributes["proc_id"])) where log.attributes["proc_id"] != nil and log.attributes["appname"] != "CEF"'
          - 'set(log.attributes["log.syslog.priority"], log.attributes["priority"]) where log.attributes["priority"] != nil'
          - 'set(log.attributes["log.syslog.facility.code"], log.attributes["facility"]) where log.attributes["facility"] != nil'
          - 'set(log.attributes["log.syslog.facility.name"], log.attributes["facility_text"]) where log.attributes["facility_text"] != nil'

      # ---- CEF envelope → event.* / observer.* ----------------------
      - context: log
        conditions:
          - 'attributes["cef_kv"] != nil'
        statements:
          # Keep the raw frame before body is replaced by the human
          # message below. Non-CEF records skip this: their body is
          # never rewritten, so a copy would be pure duplication.
          - 'set(log.attributes["event.original"], log.body) where IsString(log.body)'
          - 'set(log.attributes["event.module"], "unifi")'
          - 'set(log.attributes["event.provider"], "unifi-network")'
          - 'set(log.attributes["event.code"], log.attributes["cef_signature_id"])'
          - 'set(log.attributes["event.severity"], Int(log.attributes["cef_severity"]))'
          - 'set(log.attributes["observer.vendor"], log.attributes["cef_vendor"])'
          - 'set(log.attributes["observer.product"], log.attributes["cef_product"])'
          - 'set(log.attributes["observer.version"], log.attributes["cef_device_version"])'
          - 'set(log.attributes["observer.type"], "firewall")'
          - 'set(log.attributes["unifi.site"], log.attributes["cef_kv"]["UNIFIhost"])'
          - 'set(log.attributes["unifi.category"], log.attributes["cef_kv"]["UNIFIcategory"])'
          # event.action is the CEF event name slugged: "Blocked by
          # Firewall" → "blocked_by_firewall".
          - 'set(log.attributes["event.action"], log.attributes["cef_name"])'
          - 'replace_pattern(log.attributes["event.action"], "\\s+", "_")'
          - 'set(log.attributes["event.action"], ConvertCase(log.attributes["event.action"], "lower"))'
          # UNIFIutcTime is UTC and millisecond-precise; the syslog
          # header is local time truncated to the second. Prefer it.
          - 'set(log.time, Time(log.attributes["cef_kv"]["UNIFIutcTime"], "%Y-%m-%dT%H:%M:%S.%LZ")) where log.attributes["cef_kv"]["UNIFIutcTime"] != nil'
          # ECS: message is the human-readable line, event.original the
          # raw frame (captured above, before body is overwritten).
          - 'set(log.body, log.attributes["cef_kv"]["msg"]) where log.attributes["cef_kv"]["msg"] != nil'
          # UniFi CEF severity runs 1 (routine) → 10 (critical).
          - 'set(log.severity_number, SEVERITY_NUMBER_INFO) where Int(log.attributes["cef_severity"]) <= 3'
          - 'set(log.severity_number, SEVERITY_NUMBER_WARN) where Int(log.attributes["cef_severity"]) > 3 and Int(log.attributes["cef_severity"]) <= 6'
          - 'set(log.severity_number, SEVERITY_NUMBER_ERROR) where Int(log.attributes["cef_severity"]) > 6'
          - 'set(log.severity_text, "INFO") where log.severity_number == SEVERITY_NUMBER_INFO'
          - 'set(log.severity_text, "WARN") where log.severity_number == SEVERITY_NUMBER_WARN'
          - 'set(log.severity_text, "ERROR") where log.severity_number == SEVERITY_NUMBER_ERROR'

      # ---- Taxonomy: event.kind / dataset / category / type ---------
      # Defaults first, then UNIFIcategory, then per-code refinement,
      # so an unseen event code still lands somewhere sensible instead
      # of falling out of the schema entirely.
      - context: log
        conditions:
          - 'attributes["cef_kv"] != nil'
        statements:
          - 'set(log.attributes["event.kind"], "event")'
          - 'set(log.attributes["event.dataset"], "unifi.network")'
          - 'set(log.attributes["event.category"], ["network"])'
          - 'set(log.attributes["event.type"], ["info"])'

          # By UniFi's own category column.
          - 'set(log.attributes["event.dataset"], "unifi.client") where log.attributes["cef_kv"]["UNIFIcategory"] == "Client Devices"'
          - 'set(log.attributes["event.dataset"], "unifi.audit") where log.attributes["cef_kv"]["UNIFIcategory"] == "Audit"'
          - 'set(log.attributes["event.dataset"], "unifi.security") where log.attributes["cef_kv"]["UNIFIcategory"] == "Security"'
          - 'set(log.attributes["event.category"], ["configuration"]) where log.attributes["cef_kv"]["UNIFIcategory"] == "Audit"'
          - 'set(log.attributes["event.type"], ["change"]) where log.attributes["cef_kv"]["UNIFIcategory"] == "Audit"'

          # Anything carrying a firewall policy is firewall traffic.
          - 'set(log.attributes["event.dataset"], "unifi.firewall") where log.attributes["cef_kv"]["UNIFIpolicyType"] == "Firewall"'
          - 'set(log.attributes["event.category"], ["network"]) where log.attributes["cef_kv"]["UNIFIpolicyType"] == "Firewall"'
          - 'set(log.attributes["event.type"], ["connection", "denied"]) where log.attributes["cef_kv"]["act"] == "blocked"'
          - 'set(log.attributes["event.type"], ["connection", "allowed"]) where log.attributes["cef_kv"]["act"] == "allowed"'

          # Per-code refinement (codes verified against live traffic).
          #
          # ---- Alerting -------------------------------------------
          # Everything UniFi files under category Security becomes
          # event.kind: alert, EXCEPT policy enforcement.
          #
          # Deny-list on purpose. An allow-list of known-bad codes
          # silently missed code 201 ("a network intrusion attempt has
          # been detected and blocked") because 201 had not yet occurred
          # when the taxonomy was written. Defaulting an unseen security
          # code to alert fails loud instead of silent.
          #
          # UNIFIpolicyType is the discriminator UniFi actually provides:
          #   Firewall  → policy enforcement (the overwhelming majority
          #               of Security records; "blocked from accessing X
          #               by the <name> Firewall Policy")
          #   IDS/IPS   → a detection (code 201, UNIFIpolicyName carries
          #               the signature, e.g. "Scanning Activity")
          # ECS already has a home for enforcement — event.type:
          # [connection, denied] — and promoting it would bury real
          # detections under one alert every couple of minutes.
          #
          # Code 203 is excluded as well as, not instead of, the policy
          # type: 203s have been observed carrying no UNIFIpolicyType at
          # all, so the policy-type test alone would have alerted them.
          #
          # Both tests read UNIFIcategory / UNIFIpolicyType, UniFi's own
          # columns — NOT our event.dataset. Firewall records are
          # reclassified to unifi.firewall, so they carry category
          # Security but dataset unifi.firewall.
          - 'set(log.attributes["event.kind"], "alert") where log.attributes["cef_kv"]["UNIFIcategory"] == "Security" and log.attributes["cef_signature_id"] != "203" and log.attributes["cef_kv"]["UNIFIpolicyType"] != "Firewall"'
          - 'set(log.attributes["event.category"], ["intrusion_detection", "network"]) where log.attributes["cef_kv"]["UNIFIcategory"] == "Security" and log.attributes["cef_signature_id"] != "203" and log.attributes["cef_kv"]["UNIFIpolicyType"] != "Firewall"'
          # 202 Honeypot Triggered is a state observation, not a blocked
          # connection, so it keeps event.type: [info] rather than the
          # [connection, denied] that act=blocked would otherwise set.
          - 'set(log.attributes["event.type"], ["info"]) where log.attributes["cef_signature_id"] == "202"'
          # 401/404 client disconnect, 403 connect, 402 roam.
          - 'set(log.attributes["event.type"], ["connection", "end"]) where log.attributes["cef_signature_id"] == "401" or log.attributes["cef_signature_id"] == "404"'
          - 'set(log.attributes["event.type"], ["connection", "start"]) where log.attributes["cef_signature_id"] == "403" or log.attributes["cef_signature_id"] == "405"'
          - 'set(log.attributes["event.type"], ["connection", "change"]) where log.attributes["cef_signature_id"] == "402"'
          # 544 Network Accessed — an admin signing in to UniFi Network.
          - 'set(log.attributes["event.category"], ["authentication"]) where log.attributes["cef_signature_id"] == "544"'
          - 'set(log.attributes["event.type"], ["start"]) where log.attributes["cef_signature_id"] == "544"'
          - 'set(log.attributes["event.outcome"], "success") where log.attributes["cef_signature_id"] == "544"'
          # 546 Config Modified.
          - 'set(log.attributes["event.category"], ["configuration"]) where log.attributes["cef_signature_id"] == "546"'
          - 'set(log.attributes["event.type"], ["change"]) where log.attributes["cef_signature_id"] == "546"'

      # NOTE: process.name cannot be taken from the syslog `appname`
      # field. The UDM emits a DOUBLED hostname —
      #   <13>Aug 12 16:02:02 Gateway Gateway coredns[4155]: {...}
      # — so the RFC3164 parser consumes the first hostname, finds the
      # second one is not a valid tag (no colon), and leaves appname
      # UNSET with the tag still inside `message`. On CEF records the
      # opposite happens: "CEF:" looks like a tag, so appname is the
      # literal string "CEF". Mapping appname → process.name therefore
      # yields nothing useful for device logs and pollutes every CEF
      # record. Verified by replay.
      # transform/device_syslog below recovers it with a regex over
      # `message`, which is why the appname rule above is kept as well:
      # it is the correct source on any device that does NOT double its
      # hostname, and device_syslog defers to it.

      # ---- Non-CEF syslog fallback ----------------------------------
      # Plain syslog from the UDM (anything not routed through the SIEM
      # Server) still gets a dataset, so no UniFi record leaves this
      # collector outside the schema. Deliberately scoped to cef_kv ==
      # nil: a CEF record reaching the end with no dataset is a hole in
      # the taxonomy, and transform/tag_mapping_failures must still be
      # able to see it.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil'
        statements:
          - 'set(log.attributes["event.module"], "unifi")'
          - 'set(log.attributes["event.provider"], "unifi-syslog")'
          - 'set(log.attributes["event.kind"], "event")'
          - 'set(log.attributes["event.dataset"], "unifi.syslog")'
          - 'set(log.attributes["event.category"], ["network"])'
          - 'set(log.attributes["event.type"], ["info"])'
          - 'set(log.attributes["observer.vendor"], "Ubiquiti")'

      # ---- Network 5-tuple ------------------------------------------
      # Source precedence: firewall events use UNIFIsrcClientIp, client
      # events UNIFIclientIp, audit events the bare CEF src.
      - context: log
        conditions:
          - 'attributes["cef_kv"] != nil'
        statements:
          - 'set(log.attributes["source.ip"], log.attributes["cef_kv"]["UNIFIsrcClientIp"]) where log.attributes["cef_kv"]["UNIFIsrcClientIp"] != nil'
          - 'set(log.attributes["source.ip"], log.attributes["cef_kv"]["UNIFIclientIp"]) where log.attributes["source.ip"] == nil and log.attributes["cef_kv"]["UNIFIclientIp"] != nil'
          - 'set(log.attributes["source.ip"], log.attributes["cef_kv"]["src"]) where log.attributes["source.ip"] == nil and log.attributes["cef_kv"]["src"] != nil'
          - 'set(log.attributes["source.mac"], log.attributes["cef_kv"]["UNIFIsrcClientMac"]) where log.attributes["cef_kv"]["UNIFIsrcClientMac"] != nil'
          - 'set(log.attributes["source.mac"], log.attributes["cef_kv"]["UNIFIclientMac"]) where log.attributes["source.mac"] == nil and log.attributes["cef_kv"]["UNIFIclientMac"] != nil'
          - 'set(log.attributes["source.domain"], log.attributes["cef_kv"]["UNIFIsrcClientHostname"]) where log.attributes["cef_kv"]["UNIFIsrcClientHostname"] != nil'
          - 'set(log.attributes["source.domain"], log.attributes["cef_kv"]["UNIFIclientHostname"]) where log.attributes["source.domain"] == nil and log.attributes["cef_kv"]["UNIFIclientHostname"] != nil'
          - 'set(log.attributes["source.port"], Int(log.attributes["cef_kv"]["spt"])) where log.attributes["cef_kv"]["spt"] != nil'
          - 'set(log.attributes["destination.ip"], log.attributes["cef_kv"]["dst"]) where log.attributes["cef_kv"]["dst"] != nil'
          - 'set(log.attributes["destination.port"], Int(log.attributes["cef_kv"]["dpt"])) where log.attributes["cef_kv"]["dpt"] != nil'
          - 'set(log.attributes["destination.domain"], log.attributes["cef_kv"]["UNIFIdstDomain"]) where log.attributes["cef_kv"]["UNIFIdstDomain"] != nil'
          - 'set(log.attributes["destination.geo.country_iso_code"], log.attributes["cef_kv"]["UNIFIdstRegion"]) where log.attributes["cef_kv"]["UNIFIdstRegion"] != nil'
          # OTel semconv twins of source.ip / destination.ip.
          - 'set(log.attributes["source.address"], log.attributes["source.ip"]) where log.attributes["source.ip"] != nil'
          - 'set(log.attributes["destination.address"], log.attributes["destination.ip"]) where log.attributes["destination.ip"] != nil'

          - 'set(log.attributes["network.transport"], ConvertCase(log.attributes["cef_kv"]["proto"], "lower")) where log.attributes["cef_kv"]["proto"] != nil'
          - 'set(log.attributes["network.protocol"], ConvertCase(log.attributes["cef_kv"]["app"], "lower")) where log.attributes["cef_kv"]["app"] != nil'
          - 'set(log.attributes["network.direction"], "outbound") where log.attributes["cef_kv"]["UNIFIdirection"] == "outgoing"'
          - 'set(log.attributes["network.direction"], "inbound") where log.attributes["cef_kv"]["UNIFIdirection"] == "incoming"'
          - 'set(log.attributes["network.bytes"], Int(log.attributes["cef_kv"]["UNIFItotalBytes"])) where log.attributes["cef_kv"]["UNIFItotalBytes"] != nil'
          - 'set(log.attributes["network.packets"], Int(log.attributes["cef_kv"]["UNIFItotalPackets"])) where log.attributes["cef_kv"]["UNIFItotalPackets"] != nil'
          - 'set(log.attributes["network.name"], log.attributes["cef_kv"]["UNIFInetworkName"]) where log.attributes["cef_kv"]["UNIFInetworkName"] != nil'
          - 'set(log.attributes["network.vlan.id"], log.attributes["cef_kv"]["UNIFInetworkVlan"]) where log.attributes["cef_kv"]["UNIFInetworkVlan"] != nil'

          - 'set(log.attributes["rule.name"], log.attributes["cef_kv"]["UNIFIpolicyName"]) where log.attributes["cef_kv"]["UNIFIpolicyName"] != nil'
          - 'set(log.attributes["rule.ruleset"], log.attributes["cef_kv"]["UNIFIpolicyType"]) where log.attributes["cef_kv"]["UNIFIpolicyType"] != nil'
          - 'set(log.attributes["observer.ingress.interface.name"], log.attributes["cef_kv"]["deviceInboundInterface"]) where log.attributes["cef_kv"]["deviceInboundInterface"] != nil'
          - 'set(log.attributes["observer.egress.interface.name"], log.attributes["cef_kv"]["deviceOutboundInterface"]) where log.attributes["cef_kv"]["deviceOutboundInterface"] != nil'

          - 'set(log.attributes["user.name"], log.attributes["cef_kv"]["UNIFIadmin"]) where log.attributes["cef_kv"]["UNIFIadmin"] != nil'

          # related.* is built branch-wise: OTTL list literals would
          # otherwise embed nils for the absent side.
          - 'set(log.attributes["related.ip"], [log.attributes["source.ip"], log.attributes["destination.ip"]]) where log.attributes["source.ip"] != nil and log.attributes["destination.ip"] != nil'
          - 'set(log.attributes["related.ip"], [log.attributes["source.ip"]]) where log.attributes["source.ip"] != nil and log.attributes["destination.ip"] == nil'
          - 'set(log.attributes["related.ip"], [log.attributes["destination.ip"]]) where log.attributes["source.ip"] == nil and log.attributes["destination.ip"] != nil'
          - 'set(log.attributes["related.user"], [log.attributes["user.name"]]) where log.attributes["user.name"] != nil'
          - 'set(log.attributes["related.hosts"], [log.attributes["source.domain"], log.attributes["destination.domain"]]) where log.attributes["source.domain"] != nil and log.attributes["destination.domain"] != nil'
          - 'set(log.attributes["related.hosts"], [log.attributes["source.domain"]]) where log.attributes["source.domain"] != nil and log.attributes["destination.domain"] == nil'
          - 'set(log.attributes["related.hosts"], [log.attributes["destination.domain"]]) where log.attributes["source.domain"] == nil and log.attributes["destination.domain"] != nil'

      # ---- Vendor fields ECS has no home for ------------------------
      - context: log
        conditions:
          - 'attributes["cef_kv"] != nil'
        statements:
          - 'set(log.attributes["unifi.action"], log.attributes["cef_kv"]["act"]) where log.attributes["cef_kv"]["act"] != nil'
          - 'set(log.attributes["unifi.risk"], log.attributes["cef_kv"]["UNIFIrisk"]) where log.attributes["cef_kv"]["UNIFIrisk"] != nil'
          - 'set(log.attributes["unifi.source.zone"], log.attributes["cef_kv"]["UNIFIsrcZone"]) where log.attributes["cef_kv"]["UNIFIsrcZone"] != nil'
          - 'set(log.attributes["unifi.destination.zone"], log.attributes["cef_kv"]["UNIFIdstZone"]) where log.attributes["cef_kv"]["UNIFIdstZone"] != nil'
          - 'set(log.attributes["unifi.client.alias"], log.attributes["cef_kv"]["UNIFIsrcClientAlias"]) where log.attributes["cef_kv"]["UNIFIsrcClientAlias"] != nil'
          - 'set(log.attributes["unifi.client.alias"], log.attributes["cef_kv"]["UNIFIclientAlias"]) where log.attributes["unifi.client.alias"] == nil and log.attributes["cef_kv"]["UNIFIclientAlias"] != nil'
          - 'set(log.attributes["unifi.client.model"], log.attributes["cef_kv"]["UNIFIsrcClientModel"]) where log.attributes["cef_kv"]["UNIFIsrcClientModel"] != nil'
          - 'set(log.attributes["unifi.flow.id"], log.attributes["cef_kv"]["UNIFIflowId"]) where log.attributes["cef_kv"]["UNIFIflowId"] != nil and log.attributes["cef_kv"]["UNIFIflowId"] != "null"'
          - 'set(log.attributes["unifi.flow.count"], Int(log.attributes["cef_kv"]["UNIFIflowCount"])) where log.attributes["cef_kv"]["UNIFIflowCount"] != nil'
          - 'set(log.attributes["unifi.network.subnet"], log.attributes["cef_kv"]["UNIFInetworkSubnet"]) where log.attributes["cef_kv"]["UNIFInetworkSubnet"] != nil'
          - 'set(log.attributes["unifi.link_speed"], log.attributes["cef_kv"]["UNIFIlinkSpeed"]) where log.attributes["cef_kv"]["UNIFIlinkSpeed"] != nil'

          # Wi-Fi association detail (ECS has no wireless field set).
          - 'set(log.attributes["unifi.wifi.ssid"], log.attributes["cef_kv"]["UNIFIwifiName"]) where log.attributes["cef_kv"]["UNIFIwifiName"] != nil'
          - 'set(log.attributes["unifi.wifi.band"], log.attributes["cef_kv"]["UNIFIwifiBand"]) where log.attributes["cef_kv"]["UNIFIwifiBand"] != nil'
          - 'set(log.attributes["unifi.wifi.channel"], Int(log.attributes["cef_kv"]["UNIFIwifiChannel"])) where log.attributes["cef_kv"]["UNIFIwifiChannel"] != nil'
          - 'set(log.attributes["unifi.wifi.channel_width"], Int(log.attributes["cef_kv"]["UNIFIwifiChannelWidth"])) where log.attributes["cef_kv"]["UNIFIwifiChannelWidth"] != nil'
          - 'set(log.attributes["unifi.wifi.rssi"], Int(log.attributes["cef_kv"]["UNIFIWiFiRssi"])) where log.attributes["cef_kv"]["UNIFIWiFiRssi"] != nil'
          - 'set(log.attributes["unifi.wifi.airtime_utilization"], Int(log.attributes["cef_kv"]["UNIFIwifiAirtimeUtilization"])) where log.attributes["cef_kv"]["UNIFIwifiAirtimeUtilization"] != nil'
          - 'set(log.attributes["unifi.wifi.interference"], Int(log.attributes["cef_kv"]["UNIFIwifiInterference"])) where log.attributes["cef_kv"]["UNIFIwifiInterference"] != nil'

          # AP/switch the client is on, and the one it came from.
          - 'set(log.attributes["unifi.uplink.name"], log.attributes["cef_kv"]["UNIFIconnectedToDeviceName"]) where log.attributes["cef_kv"]["UNIFIconnectedToDeviceName"] != nil'
          - 'set(log.attributes["unifi.uplink.ip"], log.attributes["cef_kv"]["UNIFIconnectedToDeviceIp"]) where log.attributes["cef_kv"]["UNIFIconnectedToDeviceIp"] != nil'
          - 'set(log.attributes["unifi.uplink.mac"], log.attributes["cef_kv"]["UNIFIconnectedToDeviceMac"]) where log.attributes["cef_kv"]["UNIFIconnectedToDeviceMac"] != nil'
          - 'set(log.attributes["unifi.uplink.model"], log.attributes["cef_kv"]["UNIFIconnectedToDeviceModel"]) where log.attributes["cef_kv"]["UNIFIconnectedToDeviceModel"] != nil'
          - 'set(log.attributes["unifi.uplink.version"], log.attributes["cef_kv"]["UNIFIconnectedToDeviceVersion"]) where log.attributes["cef_kv"]["UNIFIconnectedToDeviceVersion"] != nil'
          - 'set(log.attributes["unifi.uplink.port"], Int(log.attributes["cef_kv"]["UNIFIconnectedToDevicePort"])) where log.attributes["cef_kv"]["UNIFIconnectedToDevicePort"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.name"], log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceName"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceName"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.ip"], log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceIp"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceIp"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.mac"], log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceMac"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceMac"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.model"], log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceModel"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceModel"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.version"], log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceVersion"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToDeviceVersion"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.port"], Int(log.attributes["cef_kv"]["UNIFIlastConnectedToDevicePort"])) where log.attributes["cef_kv"]["UNIFIlastConnectedToDevicePort"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.rssi"], Int(log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiRssi"])) where log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiRssi"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.channel"], Int(log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiChannel"])) where log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiChannel"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.channel_width"], Int(log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiChannelWidth"])) where log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiChannelWidth"] != nil'
          - 'set(log.attributes["unifi.previous_uplink.band"], log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiBand"]) where log.attributes["cef_kv"]["UNIFIlastConnectedToWiFiBand"] != nil'

          # Session summary on disconnect. Left as keywords: UniFi
          # emits pre-formatted strings ("1h 56m", "4.54 MB").
          - 'set(log.attributes["unifi.session.duration"], log.attributes["cef_kv"]["UNIFIduration"]) where log.attributes["cef_kv"]["UNIFIduration"] != nil'
          - 'set(log.attributes["unifi.session.usage_up"], log.attributes["cef_kv"]["UNIFIusageUp"]) where log.attributes["cef_kv"]["UNIFIusageUp"] != nil'
          - 'set(log.attributes["unifi.session.usage_down"], log.attributes["cef_kv"]["UNIFIusageDown"]) where log.attributes["cef_kv"]["UNIFIusageDown"] != nil'

          # Audit detail.
          - 'set(log.attributes["unifi.access_method"], log.attributes["cef_kv"]["UNIFIaccessMethod"]) where log.attributes["cef_kv"]["UNIFIaccessMethod"] != nil'
          - 'set(log.attributes["unifi.settings.section"], log.attributes["cef_kv"]["UNIFIsettingsSection"]) where log.attributes["cef_kv"]["UNIFIsettingsSection"] != nil'
          - 'set(log.attributes["unifi.settings.entry"], log.attributes["cef_kv"]["UNIFIsettingsEntry"]) where log.attributes["cef_kv"]["UNIFIsettingsEntry"] != nil'
          - 'set(log.attributes["unifi.settings.changes"], log.attributes["cef_kv"]["UNIFIsettingsChanges"]) where log.attributes["cef_kv"]["UNIFIsettingsChanges"] != nil'

          # Reporting device (honeypot events name the UDM explicitly).
          - 'set(log.attributes["observer.ip"], log.attributes["cef_kv"]["UNIFIdeviceIp"]) where log.attributes["cef_kv"]["UNIFIdeviceIp"] != nil'
          - 'set(log.attributes["observer.mac"], log.attributes["cef_kv"]["UNIFIdeviceMac"]) where log.attributes["cef_kv"]["UNIFIdeviceMac"] != nil'
          - 'set(log.attributes["unifi.device.model"], log.attributes["cef_kv"]["UNIFIdeviceModel"]) where log.attributes["cef_kv"]["UNIFIdeviceModel"] != nil'
          - 'set(log.attributes["unifi.device.version"], log.attributes["cef_kv"]["UNIFIdeviceVersion"]) where log.attributes["cef_kv"]["UNIFIdeviceVersion"] != nil'

  # ── Device system log → ECS ───────────────────────────────────────
  # Enabling device activity logging on the UDM does not produce more CEF
  # activity events — it forwards each device's raw Linux system log as
  # ordinary RFC3164 syslog. Order 10k–20k records/day on a small site,
  # but measure your own: size it by ingest time, not by the record
  # timestamp — see the syslog-ng replay warning in the README.
  #
  # Runs after transform/unifi_ecs so the non-CEF fallback has already
  # stamped the envelope fields, and before transform/strip_working_fields
  # because everything here reads `message`.
  #
  # Every statement group is scoped to cef_kv == nil. A CEF record must
  # never reach these rules: "CEF:0|Ubiquiti|..." would otherwise parse as
  # a process tag.
  transform/device_syslog:
    error_mode: ignore
    log_statements:
      # ---- 1. process.name / process.pid / process.executable --------
      # The doubled hostname is eaten by a LAZY (?:\S+\s+)*? prefix rather
      # than a fixed \S+\s+. Lazy matters: it tries zero repetitions
      # first, so a device that does NOT double its hostname still parses
      # (a fixed prefix would swallow the real tag and call the first word
      # of the message a process). Verified both ways by replay.
      #
      # Scoped to process.name == nil so the appname rule in
      # transform/unifi_ecs wins wherever the syslog parser got it right.
      #
      # RE2: no lookahead, no backreferences. The condition duplicates the
      # pattern because a non-matching ExtractPatterns raises, and
      # error_mode: ignore logs every raise — at this volume that is the
      # difference between a quiet collector and a noisy one.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["process.name"] == nil and attributes["message"] != nil and IsMatch(attributes["message"], "^(?:\\S+\\s+)*?[A-Za-z0-9_./-]+(?:\\[[0-9]+\\])?:\\s")'
        statements:
          - 'merge_maps(log.attributes, ExtractPatterns(log.attributes["message"], "^(?:\\S+\\s+)*?(?P<dev_tag>[A-Za-z0-9_./-]+)(?:\\[(?P<dev_pid>[0-9]+)\\])?:\\s+(?P<dev_msg>.*)$"), "upsert")'
          # unifi-mq-broker logs its tag as a full path. ECS puts the path
          # in process.executable and the basename in process.name.
          - 'set(log.attributes["process.executable"], log.attributes["dev_tag"]) where IsMatch(log.attributes["dev_tag"], "^/")'
          - 'set(log.attributes["process.name"], log.attributes["dev_tag"])'
          - 'replace_pattern(log.attributes["process.name"], "^.*/", "")'
          - 'set(log.attributes["process.pid"], Int(log.attributes["dev_pid"])) where log.attributes["dev_pid"] != nil and log.attributes["dev_pid"] != ""'

      # ---- 2. body → the message, raw frame → event.original ---------
      # Non-CEF records used to keep the whole frame in body, which the
      # comment in the CEF branch called "pure duplication" to avoid. That
      # reasoning inverts once the header is parsed: PRI, timestamp,
      # hostname and tag are now all structured fields, so leaving them in
      # body duplicates them in the one place that IS indexed. Move the
      # raw frame to event.original (ECS marks it index: false) and keep
      # only the human-readable half in body.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["dev_msg"] != nil'
        statements:
          - 'set(log.attributes["event.original"], log.body) where IsString(log.body)'
          - 'set(log.body, log.attributes["dev_msg"])'

      # ---- 3. coredns → unifi.dns ------------------------------------
      # The gateway's DNS *block* decision log, already structured JSON.
      #
      # Volume is BURSTY and client-driven, so do not size it from one sample:
      # coredns was half of all device records during a burst of one client
      # hammering a blocked domain, and under 2% an hour later.
      #
      # It is NOT general query logging: every coredns record sampled carried
      # a "type", split between dnsAdBlock and contentFilteringBlock (with
      # categories such as CIPA / ANONYMIZERS / UNREACHABLE_DOMAINS). Do not
      # present this dataset as a record of every lookup — only blocked ones
      # appear.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["process.name"] == "coredns" and IsMatch(log.body, "^\\{")'
        statements:
          - 'set(log.attributes["dns_kv"], ParseJSON(log.body))'

      - context: log
        conditions:
          - 'attributes["dns_kv"] != nil'
        statements:
          - 'set(log.attributes["event.dataset"], "unifi.dns")'
          - 'set(log.attributes["event.category"], ["network"])'
          - 'set(log.attributes["event.type"], ["connection", "denied"])'
          - 'set(log.attributes["event.outcome"], "success")'
          # Stable ECS-ish action names; the vendor spelling is kept in
          # unifi.block_type so a new "type" value is still visible.
          - 'set(log.attributes["unifi.block_type"], log.attributes["dns_kv"]["type"]) where log.attributes["dns_kv"]["type"] != nil'
          - 'set(log.attributes["event.action"], "dns_blocked")'
          - 'set(log.attributes["event.action"], "dns_ad_blocked") where log.attributes["dns_kv"]["type"] == "dnsAdBlock"'
          - 'set(log.attributes["event.action"], "dns_content_filtered") where log.attributes["dns_kv"]["type"] == "contentFilteringBlock"'
          - 'set(log.attributes["rule.category"], log.attributes["dns_kv"]["category"]) where log.attributes["dns_kv"]["category"] != nil'
          - 'set(log.attributes["dns.question.name"], log.attributes["dns_kv"]["domain"]) where log.attributes["dns_kv"]["domain"] != nil'
          - 'set(log.attributes["source.ip"], log.attributes["dns_kv"]["src_ip"]) where log.attributes["dns_kv"]["src_ip"] != nil'
          - 'set(log.attributes["source.ip"], log.attributes["dns_kv"]["ip"]) where log.attributes["source.ip"] == nil and log.attributes["dns_kv"]["ip"] != nil'
          - 'set(log.attributes["source.port"], Int(log.attributes["dns_kv"]["src_port"])) where log.attributes["dns_kv"]["src_port"] != nil'
          - 'set(log.attributes["source.mac"], log.attributes["dns_kv"]["mac"]) where log.attributes["dns_kv"]["mac"] != nil'
          # dst is the UDM's OWN resolver (127.0.0.1:1053), not the
          # upstream nameserver. It is the correct ECS destination for a
          # DNS transaction, but it is deliberately kept out of related.ip
          # below — a loopback address in the pivot field is pure noise.
          - 'set(log.attributes["destination.ip"], log.attributes["dns_kv"]["dst_ip"]) where log.attributes["dns_kv"]["dst_ip"] != nil'
          - 'set(log.attributes["destination.port"], Int(log.attributes["dns_kv"]["dst_port"])) where log.attributes["dns_kv"]["dst_port"] != nil'
          - 'set(log.attributes["network.transport"], ConvertCase(log.attributes["dns_kv"]["protocol"], "lower")) where log.attributes["dns_kv"]["protocol"] != nil'
          - 'set(log.attributes["network.protocol"], "dns")'
          - 'set(log.attributes["source.address"], log.attributes["source.ip"]) where log.attributes["source.ip"] != nil'
          - 'set(log.attributes["destination.address"], log.attributes["destination.ip"]) where log.attributes["destination.ip"] != nil'
          - 'set(log.attributes["related.ip"], [log.attributes["source.ip"]]) where log.attributes["source.ip"] != nil'
          - 'set(log.attributes["related.hosts"], [log.attributes["dns.question.name"]]) where log.attributes["dns.question.name"] != nil'
          # The syslog header is local time truncated to the second; the
          # payload carries epoch milliseconds. Set time_unix_nano from it
          # directly — the sibling "timestamp" field is RFC3339 with a
          # numeric offset, and OTTL's Time() ctime formats do not have a
          # colon-separated %z.
          - 'set(log.time_unix_nano, Int(log.attributes["dns_kv"]["unix_milli_timestamp"]) * 1000000) where log.attributes["dns_kv"]["unix_milli_timestamp"] != nil'
          # body is the JSON blob, now fully mapped. Replace it with a
          # readable line rather than indexing the payload twice.
          - 'set(log.body, Concat(["blocked DNS query for ", log.attributes["dns.question.name"], " (", log.attributes["rule.category"], ")"], "")) where log.attributes["dns.question.name"] != nil and log.attributes["rule.category"] != nil'

      # ---- 4. dnsmasq-dhcp → unifi.dhcp ------------------------------
      # MAC → IP → hostname → bridge, which is the join key for every
      # other dataset. Five shapes observed:
      #   DHCPDISCOVER(br0) <mac>                  — no IP yet
      #   DHCPOFFER(br0) <ip> <mac>
      #   DHCPREQUEST(br3) <ip> <mac>
      #   DHCPACK(br3) <ip> <mac> <hostname>       — hostname optional
      #   Updating leases :: age=…                 — housekeeping
      # The IP is optional in the pattern because DHCPDISCOVER carries the
      # MAC in the position the others use for the address. "Updating
      # leases" does not match and is left to fall through to unifi.system,
      # which is where that housekeeping line belongs.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["process.name"] == "dnsmasq-dhcp" and IsMatch(log.body, "^DHCP[A-Z]+\\([^)]+\\)\\s")'
        statements:
          - 'merge_maps(log.attributes, ExtractPatterns(log.body, "^(?P<dhcp_type>DHCP[A-Z]+)\\((?P<dhcp_iface>[^)]+)\\)\\s+(?:(?P<dhcp_ip>[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)\\s+)?(?P<dhcp_mac>[0-9a-fA-F:]{17})(?:\\s+(?P<dhcp_host>\\S+))?"), "upsert")'
          - 'set(log.attributes["event.dataset"], "unifi.dhcp")'
          - 'set(log.attributes["event.category"], ["network"])'
          - 'set(log.attributes["event.type"], ["protocol"])'
          - 'set(log.attributes["network.protocol"], "dhcp")'
          - 'set(log.attributes["network.transport"], "udp")'
          # DHCPACK → dhcp_ack.
          - 'set(log.attributes["event.action"], log.attributes["dhcp_type"])'
          - 'replace_pattern(log.attributes["event.action"], "^DHCP", "dhcp_")'
          - 'set(log.attributes["event.action"], ConvertCase(log.attributes["event.action"], "lower"))'
          - 'set(log.attributes["source.mac"], log.attributes["dhcp_mac"]) where log.attributes["dhcp_mac"] != nil and log.attributes["dhcp_mac"] != ""'
          - 'set(log.attributes["source.ip"], log.attributes["dhcp_ip"]) where log.attributes["dhcp_ip"] != nil and log.attributes["dhcp_ip"] != ""'
          - 'set(log.attributes["source.address"], log.attributes["source.ip"]) where log.attributes["source.ip"] != nil'
          # The client-supplied hostname. ECS source.domain explicitly
          # allows a bare host name, and it is where the CEF branch already
          # puts UNIFIsrcClientHostname, so the two datasets pivot together.
          - 'set(log.attributes["source.domain"], log.attributes["dhcp_host"]) where log.attributes["dhcp_host"] != nil and log.attributes["dhcp_host"] != ""'
          # br0/br3 is an interface, not an operator-assigned network name,
          # so it is NOT network.name — that field carries UNIFInetworkName
          # on the CEF side and mixing the two would break it.
          - 'set(log.attributes["observer.ingress.interface.name"], log.attributes["dhcp_iface"]) where log.attributes["dhcp_iface"] != nil and log.attributes["dhcp_iface"] != ""'
          - 'set(log.attributes["related.ip"], [log.attributes["source.ip"]]) where log.attributes["source.ip"] != nil'
          - 'set(log.attributes["related.hosts"], [log.attributes["source.domain"]]) where log.attributes["source.domain"] != nil'

      # ---- 5. sudo → unifi.sudo --------------------------------------
      # Privileged execution on the gateway, otherwise invisible.
      #
      # event.kind stays "event" — NOT alert. Essentially every sudo call
      # is UniFi's own service agents firing on a timer, so an
      # unconditional alert would be pure noise. Do not size this from a
      # short sample: a one-hour window showed a single command and a
      # single account, and measured over days it is an order of magnitude
      # more, across ~10 commands and several vendor service accounts
      # (uid, ucs-update, unifi-user-assets, unifi-access, root).
      # Detection belongs in a rule in your SIEM over this dataset, where
      # it can be tuned without a collector redeploy.
      #
      # The dataset is assigned on process.name alone, before the field
      # regex runs, so sudo's FAILURE lines ("user NOT in sudoers", "3
      # incorrect password attempts") — which do not match the COMMAND
      # shape — still land here rather than being buried in unifi.system.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["process.name"] == "sudo"'
        statements:
          - 'set(log.attributes["event.dataset"], "unifi.sudo")'
          - 'set(log.attributes["event.category"], ["process"])'
          - 'set(log.attributes["event.type"], ["start"])'
          - 'set(log.attributes["event.action"], "sudo_command")'
          # The middle (?:.*?;\s*)? is what makes this cover more than the
          # one shape the UDM currently emits. UniFi's uid-agent logs
          #   uid : PWD=… ; USER=… ; COMMAND=…
          # but stock sudo puts a TTY= clause there on an interactive call
          # and an "N incorrect password attempts ;" clause on a failure —
          # and the failure is the line worth having a username on. Lazy,
          # so the common no-middle case still matches at zero cost.
          - 'merge_maps(log.attributes, ExtractPatterns(log.body, "^\\s*(?P<sudo_user>\\S+)\\s+:\\s+(?:.*?;\\s*)?PWD=(?P<sudo_pwd>\\S+)\\s*;\\s*USER=(?P<sudo_target>\\S+)\\s*;\\s*COMMAND=(?P<sudo_cmd>.*)$"), "upsert") where IsMatch(log.body, "^\\s*\\S+\\s+:\\s+(?:.*?;\\s*)?PWD=\\S+\\s*;\\s*USER=\\S+\\s*;\\s*COMMAND=")'
          - 'set(log.attributes["user.name"], log.attributes["sudo_user"]) where log.attributes["sudo_user"] != nil'
          - 'set(log.attributes["user.effective.name"], log.attributes["sudo_target"]) where log.attributes["sudo_target"] != nil'
          - 'set(log.attributes["process.working_directory"], log.attributes["sudo_pwd"]) where log.attributes["sudo_pwd"] != nil'
          - 'set(log.attributes["process.command_line"], log.attributes["sudo_cmd"]) where log.attributes["sudo_cmd"] != nil'
          - 'set(log.attributes["related.user"], [log.attributes["sudo_user"], log.attributes["sudo_target"]]) where log.attributes["sudo_user"] != nil and log.attributes["sudo_target"] != nil'
          # Outcome, so a rule can alert on failure without re-parsing the
          # body. A sudo line carrying COMMAND= and no failure phrase is by
          # definition an authorised call — sudo only logs the command line
          # once it has decided to run it. Failure is tested first and
          # success only fills a still-empty outcome, because the
          # "N incorrect password attempts" line carries a COMMAND= too.
          - 'set(log.attributes["event.outcome"], "failure") where IsMatch(log.body, "incorrect password attempts|NOT in the sudoers|authentication failure|user NOT authorized|command not allowed")'
          - 'set(log.attributes["event.action"], "sudo_auth_failure") where log.attributes["event.outcome"] == "failure"'
          - 'set(log.attributes["event.outcome"], "success") where log.attributes["event.outcome"] == nil and log.attributes["sudo_cmd"] != nil'
          # pam_unix lines name the account in "user=<name>" instead, and
          # carry no COMMAND= for the regex above to anchor on.
          - 'merge_maps(log.attributes, ExtractPatterns(log.body, "\\suser=(?P<sudo_pam_user>\\S+)\\s*$"), "upsert") where log.attributes["user.name"] == nil and IsMatch(log.body, "\\suser=\\S+\\s*$")'
          - 'set(log.attributes["user.name"], log.attributes["sudo_pam_user"]) where log.attributes["sudo_pam_user"] != nil'
          - 'set(log.attributes["related.user"], [log.attributes["sudo_pam_user"]]) where log.attributes["related.user"] == nil and log.attributes["sudo_pam_user"] != nil'

      # ---- 6. everything else → unifi.system -------------------------
      # systemd, mcad, dbus-daemon, ubios-udapi-server, ulogd, earlyoom and
      # the unifi-mq-broker error spam: gateway OS chatter, roughly half of
      # all device records. Kept rather than dropped at the collector, and
      # given its own dataset so it can carry a shorter retention than the
      # security datasets if your backend supports that.
      #
      # "Parsed" here means the syslog envelope plus process.name/pid and a
      # body with the header removed; severity is already set from the PRI
      # by the receiver. The per-daemon internal formats (ustate's logfmt,
      # ubnt_ai_daemon's "<I>:", ubnt-idsips-daemon's tab-separated level)
      # are NOT parsed yet — see issues #15, #16 and #17.
      #
      # No record is left on unifi.syslog: this is the terminal assignment
      # for the non-CEF branch, so every device record lands in exactly one
      # of unifi.dns / unifi.dhcp / unifi.sudo / unifi.system.
      - context: log
        conditions:
          - 'attributes["cef_kv"] == nil and attributes["event.dataset"] == "unifi.syslog"'
        statements:
          - 'set(log.attributes["event.dataset"], "unifi.system")'

  # There is deliberately no webhook_ecs processor — see the note in
  # 10-receivers-logs.yaml and issue #21.

  # Drops the parsing working set once mapping is done. The raw frame
  # survives in event.original, so nothing is actually lost — every
  # remaining attribute is a schema field.
  transform/strip_working_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'delete_matching_keys(log.attributes, "^(cef_|dev_|dns_kv$|dhcp_|sudo_|hostname$|appname$|facility$|facility_text$|priority$|message$|version$|proc_id$|msg_id$|structured_data$)")'

  # Tags records that failed a parsing stage; routing/parse_failures
  # diverts anything tagged into its own pipeline for review. Failure
  # shapes, most-specific last so the tag reflects the deepest stage
  # reached:
  #   syslog_header  — the syslog parser produced no message attribute
  #   cef_envelope   — message looks like CEF but the envelope regex
  #                    extracted nothing (cef_name missing)
  #   cef_extensions — envelope parsed but the extension string did not
  #                    split into a map
  #   ecs_mapping    — parsed fine but came out with no event.dataset,
  #                    i.e. it fell through the taxonomy
  transform/tag_parse_failures:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.attributes["unifi.parse_failure"], "syslog_header") where log.attributes["message"] == nil'
          - 'set(log.attributes["unifi.parse_failure"], "cef_envelope") where log.attributes["message"] != nil and IsMatch(log.attributes["message"], "CEF:\\d+\\|") and log.attributes["cef_name"] == nil'
          - 'set(log.attributes["unifi.parse_failure"], "cef_extensions") where log.attributes["cef_extensions"] != nil and log.attributes["cef_kv"] == nil'

  # Second failure gate, after ECS mapping: a CEF record that reached
  # this point without an event.dataset means the taxonomy has a hole.
  transform/tag_mapping_failures:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.attributes["unifi.parse_failure"], "ecs_mapping") where log.attributes["cef_kv"] != nil and log.attributes["event.dataset"] == nil'

  # A zero timestamp is rejected outright by some backends and silently
  # mis-bucketed by others. Any frame that skipped syslog parsing arrives
  # that way, so fall back to the time the collector saw it rather than
  # losing the record.
  transform/timestamp_guard:
    log_statements:
      - set(log.time_unix_nano, log.observed_time_unix_nano) where log.time_unix_nano == 0

  # Identity of the emitting pipeline. service.name is deliberately
  # hardcoded rather than parameterised — downstream routing keys off it,
  # and it names this collector, not the site.
  resource/unifi:
    attributes:
      - key: service.name
        value: unifi-udm
        action: upsert
      - key: observed.source
        value: unifi-otel
        action: upsert

  # NOTE: backend-specific index/stream routing is deliberately absent.
  # This config exports OTLP and nothing else; where the data lands is a
  # property of your gateway or backend, not of the parsing. See the
  # destinations documentation for per-backend recipes.

  batch:
    send_batch_size: 1024
    timeout: 5s
